name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_nfc_env.ini'
      - 'cap_cc1101_env.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_nfc_env.ini'
      - 'cap_cc1101_env.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        # Cross design: NFCA_Detect on every board (chip-coverage matrix), NFCB/F/V_Detect on
        # Core only via include. NFC protocols share the same library code path, so per-board
        # compile of NFCA is enough to catch chip issues; NFCB/F/V get one build each to confirm
        # the family-specific stack compiles.
        example:
          - NFCA_Detect
#          - NFCB_Detect    # via include (Core only)
#          - NFCF_Detect    # via include (Core only)
#          - NFCV_Detect    # via include (Core only)

        unit:
          - UnitNFC

        # Reduced from 19 → 11 boards. One representative per chip family + the boards where
        # NFC is actually deployed (NessoN1/Dial for PortA, Cardputer for CapCC1101). Uncomment
        # any line below to widen coverage.
        board:
          - Core           # ESP32 classic representative
          - Core2          # ESP32 (touch + IMU + RTC)
          - CoreS3         # ESP32-S3 representative
#          - Fire           # ESP32 (= Core + PSRAM)
#          - StampS3        # ESP32-S3 stamp variant
          - Dial           # ESP32-S3 (NFC primary use case)
#          - Atom           # ESP32 small atom
          - AtomS3         # ESP32-S3 small atom
#          - AtomS3R        # ESP32-S3 (= AtomS3 + IMU)
          - NanoC6         # ESP32-C6 (Wire GROVE constraint)
          - NanoH2         # ESP32-H2 (RISC-V single, H2 path)
#          - StickCPlus     # ESP32 (older stick)
          - StickCPlus2    # ESP32 (latest stick)
#          - StickS3        # ESP32-S3 (similar to CoreS3)
#          - Paper          # ESP32 e-ink
#          - CoreInk        # ESP32 e-ink
          - Cardputer      # ESP32-S3 (CapCC1101 built-in)
          - Tab5           # ESP32-P4 (Tab5)
          - NessoN1        # ESP32-C6 (RISC-V single, NFC PortA primary)

        framework:
          - Arduino

        espressif32:
          - latest

        include:
          # NFCB/F/V Detect on Core (cross design — see example: comment above).
          - example: NFCB_Detect
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCF_Detect
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCV_Detect
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest

          # NFCA Specific sketches
          - example: NFCA_Dump
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCA_ValueBlock
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCA_ReadWrite
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCA_NDEF
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCA_Emulation
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCA_PolicyOverride
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest

          # NFCB Specific sketches
          - example: NFCB_JapanIDCard
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest

          # NFCF Specific sketches
          - example: NFCF_Dump
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCF_NDEF
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCF_Subtract
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCF_ReadWriteMAC
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCF_JapanTransportationICCard
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCF_Emulation
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest

          # NFCV Specific sketches
          - example: NFCV_Dump
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest
          - example: NFCV_NDEF
            unit: UnitNFC
            board: Core
            framework: Arduino
            espressif32: latest

          # CapCC1101 - all examples on Cardputer
          - example: NFCA_Detect
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCA_Dump
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCA_ReadWrite
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCA_ValueBlock
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCA_NDEF
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCA_Emulation
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCA_PolicyOverride
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest

          - example: NFCB_Detect
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCB_JapanIDCard
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest

          - example: NFCF_Detect
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCF_Dump
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCF_NDEF
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCF_Subtract
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCF_ReadWriteMAC
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCF_JapanTransportationICCard
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCF_Emulation
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest

          - example: NFCV_Detect
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCV_Dump
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest
          - example: NFCV_NDEF
            unit: CapCC1101
            board: CardputerADV
            framework: Arduino
            espressif32: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
